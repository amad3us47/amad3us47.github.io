<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Hey there!</title>
		<link rel="stylesheet" href="styles/main.css">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Source+Sans+Pro:wght@900&display=swap">
		<script src="https://kit.fontawesome.com/6e106019ee.js" crossorigin="anonymous"></script>
	</head>
	<body>
		<canvas id="starfield"></canvas>
		
		<!-- Navigation Menu -->
		<nav class="nav-menu">
			<a href="#about">About</a>
			<a href="#resume">Resume</a>
		</nav>

		<script>
			// Starfield animation
			const canvas = document.getElementById('starfield');
			const ctx = canvas.getContext('2d');

			// Set canvas size
			function resizeCanvas() {
				canvas.width = window.innerWidth;
				canvas.height = window.innerHeight;
			}
			resizeCanvas();
			window.addEventListener('resize', resizeCanvas);

			// Star class
			class Star {
				constructor() {
					this.reset();
				}

				reset() {
					this.x = Math.random() * canvas.width;
					this.y = Math.random() * canvas.height;
					this.z = Math.random() * canvas.width;
					this.speed = Math.random() * 0.5 + 0.2;
				}

				update() {
					this.z -= this.speed;
					if (this.z <= 0) {
						this.reset();
					}
				}

				draw() {
					const x = (this.x - canvas.width / 2) * (canvas.width / this.z);
					const y = (this.y - canvas.height / 2) * (canvas.width / this.z);
					const s = (1 - this.z / canvas.width) * 2;

					const px = x + canvas.width / 2;
					const py = y + canvas.height / 2;

					if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
						const opacity = (1 - this.z / canvas.width);
						ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
						ctx.fillRect(px, py, s, s);
					}
				}
			}

			// Create stars
			const stars = [];
			const numStars = 800;
			for (let i = 0; i < numStars; i++) {
				stars.push(new Star());
			}

			// Animation loop
			function animate() {
				ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
				ctx.fillRect(0, 0, canvas.width, canvas.height);

				stars.forEach(star => {
					star.update();
					star.draw();
				});

				requestAnimationFrame(animate);
			}

			animate();
		</script>
	</body>
</html>
